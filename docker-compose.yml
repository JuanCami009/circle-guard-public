services:

  # ── Infraestructura ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    container_name: circleguard-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: circleguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  neo4j:
    image: neo4j:5.26
    container_name: circleguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_connector_bolt_listen__address: :7687
      NEO4J_dbms_connector_bolt_advertised__address: :7687
    volumes:
      - neo4jdata:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: circleguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: circleguard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Usar el nombre de servicio para comunicación entre contenedores
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7.2
    container_name: circleguard-redis
    ports:
      - "6379:6379"

  openldap:
    image: osixia/openldap:1.5.0
    container_name: circleguard-ldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_ORGANISATION: "CircleGuard"
      LDAP_DOMAIN: "circleguard.edu"
      LDAP_ADMIN_PASSWORD: "admin"

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    container_name: circleguard-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Microservicios ───────────────────────────────────────────────────────────

  file-service:
    build:
      context: .
      dockerfile: services/circleguard-file-service/Dockerfile
    image: circleguard/file-service:latest
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085

  gateway-service:
    build:
      context: .
      dockerfile: services/circleguard-gateway-service/Dockerfile
    image: circleguard/gateway-service:latest
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      JWT_SECRET: "my-super-secret-dev-key-32-chars-long-12345678"
      QR_SECRET: "my-qr-secret-key-for-dev-1234567890"
    depends_on:
      - redis

  dashboard-service:
    build:
      context: .
      dockerfile: services/circleguard-dashboard-service/Dockerfile
    image: circleguard/dashboard-service:latest
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_dashboard
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - postgres

  form-service:
    build:
      context: .
      dockerfile: services/circleguard-form-service/Dockerfile
    image: circleguard/form-service:latest
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_form
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - kafka

  notification-service:
    build:
      context: .
      dockerfile: services/circleguard-notification-service/Dockerfile
    image: circleguard/notification-service:latest
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL: "false"
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      JWT_SECRET: "my-super-secret-dev-key-32-chars-long-12345678"
      QR_SECRET: "my-qr-secret-key-for-dev-1234567890"
    depends_on:
      - kafka
      - mailhog

  promotion-service:
    build:
      context: .
      dockerfile: services/circleguard-promotion-service/Dockerfile
    image: circleguard/promotion-service:latest
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/circleguard_promotion
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL: "false"
      JWT_SECRET: "my-super-secret-dev-key-32-chars-long-12345678"
    depends_on:
      - postgres
      - neo4j
      - redis
      - kafka

volumes:
  pgdata:
  neo4jdata:
