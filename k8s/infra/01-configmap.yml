apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-config
  namespace: circleguard
data:
  # Infraestructura (DNS interno de Kubernetes)
  SPRING_DATA_REDIS_HOST: redis-svc
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-svc:9092
  SPRING_NEO4J_URI: bolt://neo4j-svc:7687
  JWT_EXPIRATION: "3600000"
  QR_EXPIRATION: "300"
  AUTH_API_URL: "http://auth-service-svc:8180"

  # Fixes de startup — evitan fallos por conexiones no disponibles al arranque
  SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL: "false"
  SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"

  # Mail (notification-service conecta a MailHog, no a SMTP real)
  SPRING_MAIL_HOST: mailhog-svc
  SPRING_MAIL_PORT: "1025"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

  # JPA compartido
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

  # ── Observabilidad (Punto 7) ──────────────────────────────────────────────
  # Actuator: exponer health (con readiness/liveness), métricas y prometheus
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  # Etiqueta global aplicada a todas las métricas Micrometer
  MANAGEMENT_METRICS_TAGS_APPLICATION: circleguard
  # Tracing distribuido: muestreo 100% y envío de spans a Zipkin
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin-svc:9411/api/v2/spans
