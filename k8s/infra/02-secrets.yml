apiVersion: v1
kind: Secret
metadata:
  name: circleguard-secrets
  namespace: circleguard
type: Opaque
data:
  # admin / password
  POSTGRES_USER: YWRtaW4=
  POSTGRES_PASSWORD: cGFzc3dvcmQ=
  SPRING_DATASOURCE_USERNAME: YWRtaW4=
  SPRING_DATASOURCE_PASSWORD: cGFzc3dvcmQ=
  # neo4j / password
  SPRING_NEO4J_AUTHENTICATION_USERNAME: bmVvNGo=
  SPRING_NEO4J_AUTHENTICATION_PASSWORD: cGFzc3dvcmQ=
  # JWT: my-super-secret-dev-key-32-chars-long-12345678
  JWT_SECRET: bXktc3VwZXItc2VjcmV0LWRldi1rZXktMzItY2hhcnMtbG9uZy0xMjM0NTY3OA==
  # QR: my-qr-secret-key-for-dev-1234567890
  QR_SECRET: bXktcXItc2VjcmV0LWtleS1mb3ItZGV2LTEyMzQ1Njc4OTA=
  # Twilio placeholders (SMS no funciona en dev, el servicio arranca igual)
  TWILIO_ACCOUNT_SID: ZGV2X3BsYWNlaG9sZGVy
  TWILIO_AUTH_TOKEN: ZGV2X3BsYWNlaG9sZGVy
  # ── Seguridad (Punto 8): vault secrets e identidad para auth-service e
  # identity-service vía envFrom (evita valores inline en el Deployment)
  # admin = YWRtaW4=
  SPRING_LDAP_PASSWORD: YWRtaW4=
  # VAULT_SECRET: my-vault-secret-key-32-chars-1234 → base64
  VAULT_SECRET: bXktdmF1bHQtc2VjcmV0LWtleS0zMi1jaGFycy0xMjM0
  # VAULT_SALT: deadbeef → base64
  VAULT_SALT: ZGVhZGJlZWY=
  # VAULT_HASH_SALT: 12345678 → base64
  VAULT_HASH_SALT: MTIzNDU2Nzg=
