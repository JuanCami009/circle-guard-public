# ── Seguridad (Punto 8): RBAC ────────────────────────────────────────────────
# ServiceAccounts dedicadas por microservicio (automountServiceAccountToken: false)
# + Roles namespaced para operadores (developer) y pipeline CI (ci-deployer).
# Aplicar antes de los manifests de servicios (k8s/services/09-16-*.yml).
#
# Para dev/stage: aplicar con sed para sustituir namespace:
#   sed 's/namespace: circleguard/namespace: circleguard-dev/g' k8s/infra/18-rbac.yml | kubectl apply -f -
# ─────────────────────────────────────────────────────────────────────────────

# ── ServiceAccounts por microservicio ─────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promotion-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: form-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-service-sa
  namespace: circleguard
  labels:
    app.kubernetes.io/managed-by: kubectl
    circleguard/security: punto8
