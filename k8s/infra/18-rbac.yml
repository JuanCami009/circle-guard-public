---
# ── SA para operaciones humanas y pipeline CI ─────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: developer
  namespace: circleguard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: circleguard
---
# ── Role: developer (read-only) ───────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-developer
  namespace: circleguard
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-developer
  namespace: circleguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-developer
subjects:
  - kind: ServiceAccount
    name: developer
    namespace: circleguard
---
# ── Role: ci-deployer (gestión de deployments para Jenkins) ──────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: circleguard-ci-deployer
  namespace: circleguard
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: circleguard-ci-deployer
  namespace: circleguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: circleguard-ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: circleguard
