# ── Seguridad (Punto 8): Ingress TLS ────────────────────────────────────────
# Secret TLS self-signed (generado para dev) + Ingress-nginx que termina HTTPS
# y enruta al gateway-service.
#
# Pre-requisito: instalar el controlador ingress-nginx en el cluster:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/kind/deploy.yaml
#
# Acceso local:
#   echo "127.0.0.1 circleguard.local" | sudo tee -a /etc/hosts
#   curl -k -H 'Host: circleguard.local' https://localhost:30443/
#
# Para regenerar el certificado:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout tls.key -out tls.crt -subj "/CN=circleguard.local/O=CircleGuard"
#   kubectl create secret tls circleguard-tls --cert=tls.crt --key=tls.key \
#     -n circleguard --dry-run=client -o yaml > k8s/infra/19-ingress.yml (sección Secret)
# ─────────────────────────────────────────────────────────────────────────────

# ── Secret TLS (cert self-signed dev  - NO usar en producción real) ────────────
# Los valores son un cert/key self-signed para CN=circleguard.local generados
# con openssl para el entorno de desarrollo local (kind).
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-tls
  namespace: circleguard
  annotations:
    circleguard/cert-type: "self-signed-dev"
    circleguard/cert-cn: "circleguard.local"
    circleguard/cert-expires: "365d-from-generation"
type: kubernetes.io/tls
data:
  # Regenerar con: openssl req -x509 -nodes -days 365 -newkey rsa:2048
  #   -keyout tls.key -out tls.crt -subj "/CN=circleguard.local/O=CircleGuard"
  # Luego: base64 -i tls.crt | tr -d '\n'  y  base64 -i tls.key | tr -d '\n'
  tls.crt: 
  tls.key: 
---
# ── Ingress: HTTPS → gateway-service ─────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circleguard-ingress
  namespace: circleguard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - circleguard.local
      secretName: circleguard-tls
  rules:
    - host: circleguard.local
      http:
        paths:
          - path: /()(.*)
            pathType: Prefix
            backend:
              service:
                name: gateway-service-svc
                port:
                  number: 8087
