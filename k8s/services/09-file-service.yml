apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: file-service
          image: circleguard/file-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # ── Health probes via Spring Actuator (Punto 7) ──────────────────
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8085"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: file-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: file-service
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30085
