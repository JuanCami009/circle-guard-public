apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # Espera a que Kafka esté disponible antes de arrancar
      # (notification-service tiene @KafkaListener activos que fallan si Kafka no está listo)
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z kafka-svc 9092; do echo "Waiting for Kafka..."; sleep 5; done; echo "Kafka is ready."']
      containers:
        - name: notification-service
          image: circleguard/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          # ── Health probes via Spring Actuator (Punto 7) ──────────────────
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8082"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
