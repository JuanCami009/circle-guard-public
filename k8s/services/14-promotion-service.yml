apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      # Espera a Neo4j y Kafka antes de arrancar.
      # Neo4jSchemaConfig tiene @PostConstruct que conecta a bolt en startup.
      # SurveyListener tiene @KafkaListener que falla sin broker disponible.
      initContainers:
        - name: wait-for-neo4j
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z neo4j-svc 7687; do echo "Waiting for Neo4j bolt..."; sleep 5; done; echo "Neo4j is ready."']
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: wait-for-kafka
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z kafka-svc 9092; do echo "Waiting for Kafka..."; sleep 5; done; echo "Kafka is ready."']
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 5; done; echo "PostgreSQL is ready."']
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: promotion-service
          image: circleguard/promotion-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8088
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # ── Health probes via Spring Actuator (Punto 7) ──────────────────
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8088"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-svc:5432/circleguard_promotion"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: promotion-service
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30088
