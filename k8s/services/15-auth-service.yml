apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 5; done; echo "PostgreSQL is ready."']
        - name: wait-for-ldap
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z openldap-svc 389; do echo "Waiting for OpenLDAP..."; sleep 5; done; echo "OpenLDAP is ready."']
      containers:
        - name: auth-service
          image: circleguard/auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8180
          readinessProbe:
            tcpSocket:
              port: 8180
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8180"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-svc:5432/circleguard_auth"
            - name: SPRING_LDAP_URLS
              value: "ldap://openldap-svc:389"
            - name: SPRING_LDAP_BASE
              value: "dc=circleguard,dc=edu"
            - name: SPRING_LDAP_USERNAME
              value: "cn=admin,dc=circleguard,dc=edu"
            - name: SPRING_LDAP_PASSWORD
              value: "admin"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - port: 8180
      targetPort: 8180
      nodePort: 30180
