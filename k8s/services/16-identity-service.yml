apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      # ── Seguridad (Punto 8): SA dedicada, token no automontado ───────────
      serviceAccountName: identity-service-sa
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 5; done; echo "PostgreSQL is ready."']
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: identity-service
          image: circleguard/identity-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # ── Health probes via Spring Actuator (Punto 7) ──────────────────
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-svc:5432/circleguard_identity"
            # VAULT_SECRET / VAULT_SALT / VAULT_HASH_SALT eliminados (Punto 8):
            # se inyectan desde circleguard-secrets via envFrom
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
