apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: circleguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z postgres-svc 5432; do echo "Waiting for PostgreSQL..."; sleep 5; done; echo "PostgreSQL is ready."']
      containers:
        - name: identity-service
          image: circleguard/identity-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          envFrom:
            - configMapRef:
                name: circleguard-config
            - secretRef:
                name: circleguard-secrets
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-svc:5432/circleguard_identity"
            - name: VAULT_SECRET
              value: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536"
            - name: VAULT_SALT
              value: "deadbeef"
            - name: VAULT_HASH_SALT
              value: "12345678"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service-svc
  namespace: circleguard
spec:
  type: NodePort
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
