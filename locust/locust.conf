# ============================================================
# Configuración Locust — CircleGuard Dev Environment
# Referencia: https://docs.locust.io/en/stable/configuration.html
#
# Uso:
#   locust -f locustfile.py --config locust.conf
#
# Para Jenkins (via Docker):
#   docker run --rm --network host \
#     -v "$PWD/locust:/mnt/locust" \
#     locustio/locust \
#     -f /mnt/locust/locustfile.py \
#     --config /mnt/locust/locust.conf
# ============================================================

# Host del servicio principal (gateway — mayor carga)
# Cada HttpUser puede sobrescribir su propio host via atributo 'host'.
host = http://host.docker.internal:31087

# Número total de usuarios concurrentes simulados
users = 50

# Velocidad de generación de nuevos usuarios (usuarios/segundo)
spawn-rate = 5

# Duración total de la prueba
run-time = 60s

# Modo headless (sin UI web) — requerido para pipeline CI
headless = true

# Reporte HTML generado al finalizar
html = /mnt/locust/locust-report.html

# CSV con estadísticas por endpoint
csv = /mnt/locust/locust-stats

# No abortar la prueba si hay errores (registrarlos en el reporte)
exit-code-on-error = 1
