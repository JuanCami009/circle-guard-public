spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: "${JWT_SECRET:my-super-secret-dev-key-32-chars-long-12345678}"
  expiration: 3600000

qr:
  secret: "${QR_SECRET:my-qr-secret-key-for-dev-1234567890}"
  expiration: 300

push:
  gotify:
    url: "${GOTIFY_URL:http://localhost:8080}"
    token: "${GOTIFY_TOKEN:dev-token-replace-in-prod}"

features:
  push:
    real-delivery: "${PUSH_REAL_DELIVERY:false}"

server:
  port: 8082
