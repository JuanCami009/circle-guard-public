services:
  localstack:
    image: localstack/localstack:3
    container_name: circleguard-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,secretsmanager,iam,sts
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - "./localstack-data:/var/lib/localstack"
